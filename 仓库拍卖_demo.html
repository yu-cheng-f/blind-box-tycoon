<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库拍卖 · 盲盒 Demo（Vertical Slice）</title>
<style>
  :root{
    --bg:#12100e; --panel:#1c1916; --panel2:#241f1a; --line:#3a322a;
    --gold:#d8a441; --gold2:#f0c877; --text:#e8e2d8; --dim:#9d9384;
    --red:#c8503c; --green:#4f9a6a;
    /* V1.8 §6.2 地图主题跟随：默认=老旧社区（暖橙/米黄/深棕），切图由 setTheme 覆写 */
    --bg1:#15120f; --bg2:#0d0b09; --btn1:#4a3a1e; --btn2:#33280f;
    --nav1:#3a2f1f; --nav2:#2a2318; --chiprgb:216,164,65;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  #app{max-width:480px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
  .money{font-size:26px;font-weight:700;color:var(--gold2);letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  nav{display:flex;gap:6px;margin-bottom:12px}
  nav button{flex:1;padding:9px 0;background:var(--panel);color:var(--dim);border:1px solid var(--line);
    border-radius:8px;font-size:13px;cursor:pointer;transition:.15s}
  nav button.on{background:linear-gradient(180deg,var(--nav1),var(--nav2));color:var(--acc,#f0c877);border-color:var(--acc,#d8a441)}
  .tag.b{color:#8fb8d8;border-color:#2f4258}
  .tag.p{color:#c89bd8;border-color:#4a2f58}
  .tag.k{color:#e8e2d8;border-color:#6a6a6a}
  .risk{color:#e08b76;font-size:11px;border:1px solid #5a2f26;padding:2px 8px;border-radius:20px;display:inline-block;margin-left:6px}
  .skbtn{flex:1;padding:8px 2px;margin-top:6px;border-radius:8px;border:1px solid var(--line);background:#1a1713;
    color:#cfc7b9;font-size:11.5px;cursor:pointer}
  .skbtn:disabled{opacity:.35;cursor:not-allowed}
  .skbtn b{color:var(--gold2);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .card h3{margin:0 0 8px;font-size:15px;color:var(--gold2);font-weight:600;
    border-left:3px solid var(--gold);padding-left:8px;line-height:1.3;
    display:flex;justify-content:space-between;align-items:center}
  /* ---- 旧物集图鉴 ---- */
  .pbar{height:7px;border-radius:4px;background:#26241f;overflow:hidden;margin:4px 0 10px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .pbar i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#8a6a2a,#f0c877);transition:width .4s;
    box-shadow:0 0 6px rgba(240,200,119,.4)}
  .dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
  .dex-cell{border-radius:9px;padding:7px 2px 5px;text-align:center;border:1px solid transparent;
    transition:.15s}
  .dex-cell .illo.sm{width:30px;height:30px;margin:0}
  .dex-cell img.photo{width:30px;height:30px;min-width:0;max-width:none;margin:0 auto;border:none;border-radius:6px}
  .dex-cell .dn{font-size:10px;margin-top:3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .dex-cell .dc{font-size:8px;opacity:.75;letter-spacing:1px}
  .dex-cell.locked{background:#1b1a17;border-color:#26241f}
  .dex-cell.got{cursor:pointer}
  .dex-cell.got:active{transform:scale(.95)}
  .dex-cell.locked .qm{font-size:22px;line-height:30px;color:#3d3a33;font-weight:700}
  .dex-cell.locked .dn{color:#4a463d}
  .dex-cell.t0{background:linear-gradient(160deg,#2b2823,#211f1b)}
  .dex-cell.t0 .dn{color:#9a9284}.dex-cell.t0 .dc{color:#6e675c}
  .dex-cell.t1{background:linear-gradient(160deg,#1f2b30,#182226)}
  .dex-cell.t1 .dn{color:#8fc3cc}.dex-cell.t1 .dc{color:#54707a}
  .dex-cell.t2{background:linear-gradient(160deg,#282038,#1d1728)}
  .dex-cell.t2 .dn{color:#c3a4ee}.dex-cell.t2 .dc{color:#7a5ab8}
  .dex-cell.t3{background:linear-gradient(160deg,#33270f,#241b0b);border-color:rgba(240,200,119,.55);
    box-shadow:0 0 8px rgba(240,200,119,.22)}
  .dex-cell.t3 .dn{color:#f6d78e}.dex-cell.t3 .dc{color:#a67c2e}
  /* ---- 成就墙 ---- */
  .ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
  .ach-cell{border-radius:9px;padding:9px 4px 7px;text-align:center;border:1px solid #26241f;
    background:#1b1a17;transition:.15s}
  .ach-cell .an{font-size:11px;font-weight:700;color:#5c564b;letter-spacing:.5px}
  .ach-cell .ad{font-size:9px;color:#4a463d;margin-top:2px;line-height:1.3}
  .ach-cell .aic{font-size:16px;display:block;margin-bottom:2px;filter:grayscale(1);opacity:.45}
  .ach-cell.on{background:linear-gradient(160deg,rgba(200,150,58,.2),rgba(200,150,58,.06));
    border-color:rgba(240,200,119,.5);box-shadow:0 0 7px rgba(240,200,119,.15)}
  .ach-cell.on .an{color:#f0c877}
  .ach-cell.on .ad{color:#b39b62}
  .ach-cell.on .aic{filter:none;opacity:1;text-shadow:0 0 8px rgba(240,200,119,.5)}
  /* ---- 可点击地图卡片 ---- */
  .map-list{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .map-card{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:12px;
    border:1px solid var(--line);border-left:3px solid var(--mc,#666);
    background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(0,0,0,.14));
    cursor:pointer;transition:.15s}
  .map-card:active{transform:scale(.992)}
  .map-card.here{border-color:var(--mc);box-shadow:0 0 12px -3px var(--mc);
    background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(0,0,0,.1))}
  .map-card.lock{cursor:default}
  .map-card.lock .map-ic{filter:grayscale(.6);opacity:.8}
  .map-ic{width:46px;height:46px;border-radius:11px;font-size:24px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.13),rgba(0,0,0,.3));
    border:1px solid rgba(255,255,255,.09)}
  .map-body{flex:1;min-width:0}
  .map-name{font-size:13.5px;font-weight:700;color:#eadfc8;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
  .map-desc{font-size:11px;color:#8c8578;margin-top:3px}
  .map-meta{font-size:10.5px;color:#6f695e;margin-top:5px;line-height:1.5}
  .mpbar{height:4px;background:#26241f;border-radius:2px;margin-top:6px;overflow:hidden}
  .mpbar i{display:block;height:100%;background:var(--mc,#888);border-radius:2px;transition:width .3s}
  .map-go{margin-top:8px;padding:7px 10px;font-size:11px;border-radius:8px;width:100%;
    border:1px solid var(--mc,#888);background:rgba(255,255,255,.05);color:var(--mc,#ccc);
    font-weight:700;letter-spacing:.5px}
  .map-link{color:var(--gold2);border-bottom:1px dashed rgba(240,200,119,.55);
    padding-bottom:1px;cursor:pointer}
  .card p{margin:6px 0;font-size:13px;line-height:1.65;color:#cfc7b9}
  .btn{display:block;width:100%;padding:12px;margin-top:10px;border-radius:9px;border:1px solid var(--gold);
    background:linear-gradient(180deg,var(--btn1),var(--btn2));color:var(--gold2);font-size:14px;
    font-weight:600;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
  .btn.danger{border-color:#6b3226;color:#e08b76;background:linear-gradient(180deg,#3a2320,#2a1917)}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:8px}
  .clue{font-size:12.5px;color:#b6ab99;padding:7px 9px;background:#14110e;border-left:2px solid var(--line);
    border-radius:4px;margin:6px 0;line-height:1.6}
  .price{font-size:34px;font-weight:700;text-align:center;color:var(--gold2);margin:10px 0 2px;
    font-variant-numeric:tabular-nums}
  .price small{font-size:12px;color:var(--dim);font-weight:400;display:block;margin-top:4px}
  .log{font-size:12px;color:var(--dim);line-height:1.9;max-height:150px;overflow:auto}
  .log b{color:#cbbfa9;font-weight:500}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .tag.g{color:#7fbf95;border-color:#2f4d3b}
  .tag.r{color:#d98a76;border-color:#5a2f26}
  .tag.y{color:#d8a441;border-color:#4a3a1e}  /* 稀有度金：固定，不随地图主题变色（V1.8 §6.2） */
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed #2c251e;font-size:13px}
  .item:last-child{border:none}
  .center{text-align:center}
  .big{font-size:20px;font-weight:700;margin:8px 0;color:var(--gold2);text-align:center}
  .mask{position:fixed;inset:0;background:rgba(8,7,6,.86);display:flex;align-items:center;
    justify-content:center;padding:22px;z-index:9;backdrop-filter:blur(3px)}
  .mask .box{width:100%;max-width:400px;background:var(--panel2);border:1px solid var(--gold);
    border-radius:14px;padding:18px}
  .hide{display:none!important}
  .fade{animation:f .25s ease-out}
  @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .banner{position:relative;height:118px;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .cap{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,6,.82),rgba(10,8,6,.12) 60%,rgba(10,8,6,.45));
    display:flex;flex-direction:column;justify-content:center;padding:0 14px}
  .banner .cap b{font-size:17px;color:var(--gold2);letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .banner .cap span{font-size:11px;color:#cfc5b4;margin-top:4px}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30}
  .snd{background:transparent;border:1px solid var(--line);color:#9d9384;font-size:11px;
    padding:5px 9px;border-radius:20px;cursor:pointer}
  .snd:active{transform:scale(.95)}
  .btn{position:relative;overflow:hidden}
  .btn:active{transform:scale(.975);box-shadow:0 0 0 2px rgba(216,164,65,.28) inset}
  #mask-box.pop{animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
  .illo{display:block;margin:4px auto;width:min(86px,20vw);height:min(86px,20vw)}
  /* ---- 顶部播报弹幕条 ---- */
  #ticker{position:sticky;top:0;z-index:20;height:32px;margin:-14px -14px 10px;
    background:linear-gradient(90deg,rgba(30,25,18,.94),rgba(46,37,25,.9));
    border-bottom:1px solid var(--gold);overflow:hidden;pointer-events:none;
    display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #ticker .tmsg{position:absolute;left:100%;white-space:nowrap;font-size:12.5px;color:#cfc7b9;
    animation:troll 12s linear forwards;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  #ticker .tmsg.gold{color:#f0c877;font-weight:600;text-shadow:0 0 10px rgba(240,200,119,.6),0 1px 3px rgba(0,0,0,.7)}
  #ticker .tmsg.loop{animation-iteration-count:infinite}
  #ticker .tmsg.mega{font-size:13.5px;letter-spacing:.5px}
  @keyframes troll{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}
  .photo{display:block;margin:4px auto;width:min(120px,42vw);height:min(120px,42vw);max-width:100%;
    object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .photo.sm,.illo.sm{width:56px;height:56px;border-radius:9px;margin:2px auto}
  .photo.sm.glow-gold{box-shadow:0 0 9px rgba(216,164,65,.5)}
  .photo.glow-gold{box-shadow:0 0 18px rgba(216,164,65,.55);animation:glowp 1.8s ease-in-out infinite}
  @keyframes glowp{50%{box-shadow:0 0 30px rgba(240,200,119,.8)}}
  .mini{display:inline-block;vertical-align:middle;margin-right:8px}
  .mini svg{width:30px;height:30px;display:block}
  .mini img{width:30px;height:30px;object-fit:cover;border-radius:6px;display:block}
  .glow-gold{filter:drop-shadow(0 0 12px rgba(216,164,65,.8));animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{filter:drop-shadow(0 0 22px rgba(240,200,119,.95))}}
  /* ---- 头像 + 名片（我的页入口） ---- */
  .me-chip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    padding:3px 10px 3px 3px;border-radius:22px;margin-bottom:5px;
    background:linear-gradient(90deg,rgba(var(--chiprgb),.14),rgba(var(--chiprgb),.02));
    border:1px solid rgba(var(--chiprgb),.25);transition:background .15s}
  .me-chip:active{background:rgba(var(--chiprgb),.28)}
  .avatar{border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex:none;
    box-shadow:0 0 8px rgba(var(--chiprgb),.35);display:inline-block;vertical-align:middle}
  .avatar svg{width:100%;height:100%;display:block}
  #h-ava{width:36px;height:36px}
  .me-name{font-size:13px;font-weight:700;color:#f0e2c4;line-height:1.15}
  .me-sub{font-size:10.5px;color:#9d9384;line-height:1.2}
  .inp{width:100%;box-sizing:border-box;background:#171411;border:1px solid var(--line);
    color:#e8dcc4;border-radius:8px;padding:9px 10px;font-size:14px;margin:6px 0;outline:none}
  .inp:focus{border-color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div id="ticker"></div>
  <header>
    <div>
      <div class="me-chip" onclick="switchTab('me')">
        <span class="avatar" id="h-ava"></span>
        <span>
          <div class="me-name" id="h-name">无名仓主</div>
          <div class="me-sub">点击进「我的」 ›</div>
        </span>
      </div>
      <div class="money" id="h-money">¥0</div>
      <div class="sub" id="h-sub">第 1 天 · 快递站 Lv.1</div>
    </div>
    <div style="text-align:right">
      <div class="sub" id="h-ticket">日收益 ¥0</div>
      <button class="snd" id="snd" style="margin-top:6px">声音 开</button>
      <button class="snd" id="reset" style="margin-top:6px;margin-left:4px">重开</button>
    </div>
  </header>

  <nav>
    <button data-tab="courier" class="on">快递站</button>
    <button data-tab="auction">拍卖行</button>
    <button data-tab="museum">博物馆</button>
    <button data-tab="store">库房</button>
    <button data-tab="invest" id="tab-invest" class="hide">投资</button>
  </nav>

  <main>
    <section id="scene-courier"></section>
    <section id="scene-auction" class="hide"></section>
    <section id="scene-museum" class="hide"></section>
    <section id="scene-store" class="hide"></section>
    <section id="scene-invest" class="hide"></section>
    <section id="scene-me" class="hide"></section>
  </main>

  <div class="card" style="margin-top:4px">
    <h3>操作记录</h3>
    <div class="log" id="h-log"></div>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="mask" class="mask hide"><div class="box" id="mask-box"></div></div>

function itemArt(item, sm){
  const c = sm ? ' sm' : '';
  if(item.photo){
    return '<img class="photo glow-gold'+c+'" src="'+PHOTO[item.photo]+'">';
  }
  return (ART[item.a] || ART.goods).replace('<svg ', '<svg class="illo'+c+'" ');
}

/* ================= 全局增益小工具 ================= */
function eq(k){ return S.title === k; }
function hasTalent(k){ return Array.isArray(S.team) && S.team.indexOf(k) >= 0; }
function hasBond(k){ const b = BONDS.find(x=>x.k===k); return !!b && b.need.every(hasTalent); }
function activeBonds(){ return BONDS.filter(b=>b.need.every(hasTalent)); }
function setDefOf(name){ return SET_DEFS.find(s=>s.names.indexOf(name)>=0); }
function setNeed(d){ return d.need || 3; }
function setCountOf(d){ return S.museum.filter(m=>d.names.indexOf(m.name)>=0).length; }
function setDone(d){ return setCountOf(d) >= setNeed(d); }
function setDoneCount(){ return SET_DEFS.filter(setDone).length; }
function setBonusOf(name){
  const d = setDefOf(name); if(!d || !setDone(d)) return 1;
  return d.b + (eq('setmaster') ? 0.05 : 0);
}
function ptsCap(){ return eq('god') ? 6 : 5; }
function fixerMult(){ const lv = (S.talentLv && S.talentLv.fixer) || 1; return hasTalent('fixer') ? [1.5,1.7,1.9][lv-1] : 1; }
function checkTitles(){
  S.titles = S.titles || {};
  TITLES.forEach(function(t){
    if(!S.titles[t.k] && t.cond(S)){ S.titles[t.k] = true; say('🎖 获得称号【' + t.n + '】，去「我的」页佩戴'); sfx('rare'); }
  });
}
function checkTalentUnlocks(){
  S.unlockedTalents = S.unlockedTalents || {};
  if(!S.unlockedTalents.fixer && (S.stats.bad||0) >= 12){ S.unlockedTalents.fixer = true; say('🛠 成就达成【修复大师】：可在「我的」页上阵'); sfx('rare'); }
  if(!S.unlockedTalents.blacker && (S.stats.black||0) >= 3){ S.unlockedTalents.blacker = true; say('🌙 成就达成【黑市商人】：可在「我的」页上阵'); sfx('rare'); }
}
function equipTitle(k){ S.title = (S.title === k) ? null : k; sfx('click'); closeMask(); renderAll(); }

const $ = s => document.querySelector(s);
const rnd = (a,b) => Math.random()*(b-a)+a;
const int = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
function money(n){
  if(!isFinite(n)) n = 0;
  const neg = n < 0; n = Math.abs(Math.round(n));
  if(n < 1e4) return (neg?'-':'') + '¥' + n.toLocaleString('zh-CN');
  const U = [[1e16,'京'],[1e12,'兆'],[1e8,'亿'],[1e4,'万']];
  for(const [v,u] of U) if(n >= v) return (neg?'-':'') + '¥' + (n/v).toFixed(2) + u;
}

/* ================= 状态 ================= */
let S = {};
let shownMoney = null;
const SAVE_KEY = 'ckpm_v18_save';
const TABS = ['courier','auction','museum','store','invest','me'];
const AUCTION_EVERY = 3;   /* 拍卖会每 3 天开一场 */

function freshState(){
  return {
    v18:true, money:START_MONEY, day:1, lv:1, free:3,
    didWork:false, sound:true, talent:null,
    name:'无名仓主', av:0,
    map:'home', unlocked:{home:true}, winsByMap:{home:0,city:0,port:0},
    unboxCount:0, museum:[], store:[], storeCap:6, dayCourier:0, dayAuction:0, dayOther:0,
    dex:{}, megaCount:0, ptsBank:3,
    streak:0, offers:[], auction:null, loot:null,
    market:1, marketCat:'杂项', marketForce:null,
    invest:[], ach:{}, brokeLock:false,
    /* PRD §7.4–7.7：称号 / 人才扩展 / 套装 / 委托 / 机遇 */
    titles:{}, title:null, team:null, unlockedTalents:{}, talentLv:{},
    stats:{bad:0, black:0, recover:0, bargainWins:0, bestMult:0, myth:0, commDone:0},
    commission:null, freeRepo:false, discount:null,
    log:[]
  };
}

function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadGame(){ try{ const t=localStorage.getItem(SAVE_KEY); if(!t) return null; const o=JSON.parse(t); return (o && o.v18) ? o : null; }catch(e){ return null; } }

function netWorth(){
  return S.money + S.museum.reduce((a,b)=>a+b.value,0) + S.store.reduce((a,b)=>a+b.base,0) +
         S.invest.reduce((a,b)=>a+b.principal,0);
}

function newGame(){
  S = freshState();
  rollMarket(true);
  rollOffers();
  say('继承了社区快递站，手里只剩 ' + money(START_MONEY) + '。');
  say('先靠免费快递盲盒攒启动资金（手气差也亏得慢，余额过低有补贴托底），攒够了去解锁城市仓储地图。');
  pickTalent();
  renderAll();
}

function resumeGame(){
  const sv = loadGame();
  if(!sv){ newGame(); return; }
  S = sv;
  S.auction = null; S.loot = null; delete S._pending; delete S._quick;
  delete S._black; delete S._visitor;   /* 当日瞬态事件不跨页存活，防止死引用挡住上门收购 */
  if(!TALENTS[S.talent]) S.talent = null;  /* 旧档 talent 键失效时重选 */
  /* 旧档博物馆日票按新规则（估值 1/15）迁移重算 */
  S.museum.forEach(function(m){ m.ticket = Math.max(2, Math.round((m.value||0)/15)); });
  /* 旧档补齐新系统字段：图鉴 / 成就 / 大奖计数 / 上门收购流水 */
  S.dex = S.dex || {}; S.ach = S.ach || {};
  S.megaCount = S.megaCount || 0; S.dayOther = S.dayOther || 0;
  if(typeof S.ptsBank !== 'number') S.ptsBank = 3;  /* 旧档补战术点存量 */
  /* PRD §7.4–7.7 旧档迁移：称号 / 人才双上阵 / 套装 / 委托 / 机遇 */
  S.titles = S.titles || {}; S.title = S.title || null;
  S.unlockedTalents = S.unlockedTalents || {};
  S.talentLv = S.talentLv || {};
  S.stats = Object.assign({bad:0, black:0, recover:0, bargainWins:0, bestMult:0, myth:0, commDone:0}, S.stats || {});
  S.commission = S.commission || null; S.freeRepo = !!S.freeRepo;
  if(typeof S.discount !== 'number') S.discount = null;
  if(!Array.isArray(S.team)) S.team = S.talent ? [S.talent] : null;
  if(S.team){ S.team = S.team.filter(k => TALENTS[k]); if(!S.team.length) S.team = null; }
  /* 极旧档缺失的地图/基础字段兜底 */
  if(!MAPS[S.map]) S.map = 'home';
  if(!S.unlocked || !S.unlocked.home) S.unlocked = {home:true};
  if(!S.winsByMap) S.winsByMap = {home:0, city:0, port:0};
  if(typeof S.free !== 'number') S.free = 2 + S.lv;
  if(!Array.isArray(S.offers)) S.offers = [];
  if(!Array.isArray(S.museum)) S.museum = [];
  if(!Array.isArray(S.store)) S.store = [];
  if(!Array.isArray(S.invest)) S.invest = [];
  if(!Array.isArray(S.log)) S.log = [];
  if(typeof S.market !== 'number') S.market = 1;
  if(!S.marketCat) S.marketCat = '杂项';
  if(typeof S.storeCap !== 'number') S.storeCap = 6;
  /* 名片：旧档补头像与名字 */
  if(typeof S.name !== 'string' || !S.name) S.name = '无名仓主';
  if(typeof S.av !== 'number') S.av = 0;
  say('已恢复存档：第 ' + S.day + ' 天，' + money(S.money));
  if(!S.team) pickTalent();
  renderAll();
}

function say(t, gold){
  S.log.unshift('<b>' + t + '</b>'); S.log = S.log.slice(0,40);
  tickerShow(t, gold || /稀有|成就|🏆|成交|拍得|解锁|爆发|神话|走出生|补贴|捡到/.test(t));
}
let tickerLockUntil = 0;   /* 大奖循环播报期间，普通消息不抢占弹幕 */
function tickerShow(t, gold, loop){
  const tk = document.getElementById('ticker'); if(!tk) return;
  if(Date.now() < tickerLockUntil && !loop) return;
  if(loop) tickerLockUntil = Date.now() + 30000;
  tk.innerHTML = '<span class="tmsg'+(gold ? ' gold' : '')+(loop ? ' loop mega' : '')+'">'+t+'</span>';
}
/* 超级大奖：循环滚动的恭喜播报 */
function tickerCelebrate(t){
  tickerShow('🎉 ' + t, true, true);
}

/* 房租始终略高于免费盲盒现金期望（约 ¥61/¥81/¥102），挂机只会慢慢亏 */
function rent(){ return [0,70,90,110][S.lv]; }
/* 日票只认一条规则：估值 ÷15（≈6.7%/天），任何存量旧值一律无效；馆长称号 +15% */
function museumTicketOf(value){ return Math.max(2, Math.round((value||0)/15)); }
function ticketPay(){
  const raw = S.museum.reduce((a,b)=>a+museumTicketOf(b.value),0);
  return Math.round(raw * (eq('curator') ? 1.15 : 1));
}
function museumHasSame(name){ return S.museum.some(m => m.name === name); }

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }
  return AC;
}
function tone(f, d, type, vol, when){
  if(!S.sound) return;
  const c = ac(); if(!c) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.06, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function sfx(kind){

/* ================= 金币滚动 ================= */
function renderMoney(){
  const el = $('#h-money'), to = S.money;
  if(shownMoney === null || Math.abs(shownMoney - to) < 1){ shownMoney = to; el.textContent = money(to); return; }
  const from = shownMoney, t0 = performance.now(), dur = 340;
  shownMoney = to;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = money(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if(k < 1) requestAnimationFrame(step); else el.textContent = money(to);
  };
  requestAnimationFrame(step);
}

/* ================= 庆祝粒子 ================= */
function celebrate(){
  const c = $('#fx'), ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const cols = ['#f0c877','#d8a441','#fff3d0','#c8503c','#9fd8c8'];
  const P = [];
  for(let i=0;i<90;i++) P.push({
    x: window.innerWidth/2 + (Math.random()-0.5)*140, y: window.innerHeight*0.4,
    vx: (Math.random()-0.5)*10, vy: -Math.random()*11 - 3,
    s: 3 + Math.random()*5, r: Math.random()*6, c: cols[i % cols.length]
  });
  let f = 0;
  const tick = () => {
    ctx.clearRect(0, 0, c.width, c.height); f++;
    for(const p of P){
      p.vy += 0.36; p.x += p.vx; p.y += p.vy; p.r += 0.12;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - f/75); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*1.7); ctx.restore();
    }
    if(f < 80) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  };
  tick();
}

/* ================= 快递盲盒 ================= */
function rollCourier(){
  const rare = 0.01 + 0.005*(S.lv-1);
  const badCut = (eq('dex10') ? 0.02 : 0) + (eq('blindhand') ? 0.03 : 0);  /* 称号减坑件 */
  const rows = clone(COURIER_POOL);
  rows[3].p = rare;
  rows[2].p = Math.max(0.02, 0.09 - badCut);
  rows[0].p = Math.max(0.3, 1 - rows[1].p - rows[2].p - rare);
  let r = Math.random(), acc = 0, row = rows[0];
  for(const x of rows){ acc += x.p; if(r <= acc){ row = x; break; } }
  const item = pick(row.items);
  return { tier:row.tier, item, value:Math.round(rnd(item.v[0], item.v[1])) };
}

function unboxCourier(){
  if(S.free <= 0) return;
  S.free--; S.didWork = true; S.unboxCount++;
  const it = rollCourier();
  dexDiscover(it.item.n);
  if(it.tier === '稀有'){
    collectModal({ name:it.item.n, base:it.value, art:itemArt(it.item), from:'快递稀有件', src:'courier' });
  } else {
    let gain = it.value;
    if(it.tier === '坑件'){ S.stats.bad = (S.stats.bad||0) + 1; gain = Math.round(gain * fixerMult()); }
    gain = Math.round(gain * (eq('station') ? 1.15 : 1));
    S.money += gain;
    S.dayCourier = (S.dayCourier || 0) + gain;
    say('拆出【'+it.item.n+'】（'+it.tier+'），变现 ' + money(gain));
    sfx(it.tier === '惊喜' ? 'receive' : 'click');
    flash('快递盲盒',
      '<p class="sub" style="font-style:italic;color:#8c8578;text-align:center;margin:0 0 4px">' + pick(PACK_SCENES) + '</p>' +
      itemArt(it.item) +
      '<div class="big" style="color:var(--gold2)">'+it.tier+'</div>' +
      '<div class="center" style="font-size:15px">'+it.item.n+'</div>' +
      '<p class="sub" style="text-align:center;font-style:italic;color:#a89b84;margin:6px 2px">「' +
        (DEX_STORY[it.item.n] || '说不清来历，反正是从哪个角落里翻出来的。') + '」</p>' +
      '<div class="center sub" style="margin-top:2px">变现 '+money(gain)+
        (gain !== it.value ? '（称号/人才加成）' : '')+'</div>' +
      '<button class="btn" onclick="closeMask()">收下</button>');
  }
  commCheck();
  achCheck();
  renderAll();
}

/* PRD §7.1.4 快递大礼包：快递站 Lv.2 解锁。一包 6 件、保底至少 1 件惊喜、坑件重摇，
   期望小幅为正但方差小 —— 定位是「稳定微赚的刷图鉴渠道」，不是印钞机 */
const BATCH_COST = 128, BATCH_N = 6;
function batchCourier(){
  if(S.lv < 2){ say('快递站升到 Lv.2 解锁快递大礼包'); return; }
  if(S.money < BATCH_COST){ say('资金不足：大礼包 ' + money(BATCH_COST) + '/包（6 件）'); return; }
  S.money -= BATCH_COST; S.didWork = true;
  const loot = [];
  let hasGood = false;
  for(let i = 0; i < BATCH_N; i++){
    let it = rollCourier();
    if(it.tier === '坑件') it = rollCourier();   /* 坑件重摇一次 */
    if(it.tier === '惊喜' || it.tier === '稀有') hasGood = true;
    loot.push(it);
  }
  if(!hasGood){   /* 大礼包保底：一件惊喜都没有时，最后一件强制换成惊喜以上 */
    let it = rollCourier();
    let guard = 0;
    while(it.tier !== '惊喜' && it.tier !== '稀有' && guard++ < 50) it = rollCourier();
    loot[BATCH_N - 1] = it;
  }
  let total = 0, hasRare = false;
  const rows = loot.map(function(it){
    dexDiscover(it.item.n);
    S.unboxCount++;
    let gain = it.value;
    if(it.tier === '坑件'){ S.stats.bad = (S.stats.bad||0) + 1; gain = Math.round(gain * fixerMult()); }
    gain = Math.round(gain * (eq('station') ? 1.15 : 1));
    total += gain;
    S.money += gain;
    S.dayCourier = (S.dayCourier || 0) + gain;
    if(it.tier === '稀有') hasRare = true;
    return '<div class="item"><span><span class="mini">' + itemArt(it.item) + '</span>' +
      it.item.n + ' <span class="tag ' + (it.tier === '惊喜' || it.tier === '稀有' ? 'y' : '') + '">' + it.tier + '</span></span>' +
      '<span class="sub">' + money(gain) + '</span></div>';
  }).join('');
  say('大礼包 6 件共变现 ' + money(total) + '（成本 ' + money(BATCH_COST) +
      (total >= BATCH_COST ? '，赚 ' + money(total - BATCH_COST) : '，亏 ' + money(BATCH_COST - total)) + '）');
  sfx(hasRare || total >= BATCH_COST * 1.6 ? 'receive' : 'click');
  flash('快递大礼包',
    '<p class="sub" style="font-style:italic;color:#8c8578;text-align:center;margin:0 0 6px">' + pick(PACK_SCENES) + '</p>' +
    '<div class="card" style="background:#171411;margin:6px 0">' + rows + '</div>' +
    '<div class="center" style="font-size:15px">6 件合计变现 <b style="color:var(--gold2)">' + money(total) + '</b></div>' +
    '<div class="center sub" style="margin:4px 0 2px">成本 ' + money(BATCH_COST) + ' · ' +
      (total >= BATCH_COST
        ? '<b style="color:#7fbf95">净赚 ' + money(total - BATCH_COST) + '</b>'
        : '<span class="risk">亏 ' + money(BATCH_COST - total) + '</span>（保底没发力的正常波动）') + '</div>' +
    '<button class="btn" onclick="closeMask()">收下</button>');
  commCheck();
  achCheck();
  renderAll();
}

/* 藏品三向处理（V1.8 §6.4）：直接出售 / 私人库房 / 捐赠博物馆 */
function collectModal(o){
  const tp = sellPrice(o.base);
  const tk = museumTicketOf(o.base);
  const full = S.store.length >= S.storeCap;
  const dup = museumHasSame(o.name);
  S._pending = o;
  flash('藏品三选一 · ' + (o.from || '开箱'),
    o.art +
    '<div class="center"><span class="tag y">' + o.name + '</span></div>' +
    '<p class="sub" style="text-align:center;font-style:italic;color:#a89b84;margin:6px 4px 2px">「' +
      (DEX_STORY[o.name] || '来历不明，但摸着有年头。') + '」</p>' +
    '<div class="center sub" style="margin-top:4px">基准价值 ' + money(o.base) + ' · 今日行情 ×' + S.market.toFixed(2) + '</div>' +
    '<button class="btn" onclick="collectSell()">直接出售 +' + money(tp) + '（随行情波动）</button>' +
    '<button class="btn ghost" onclick="collectStore()" '+(full?'disabled':'')+'>' +
      (full ? '库房已满（' + S.storeCap + ' 格）' : '存入私人库房（点亮图鉴，可囤货等牛市）') + '</button>' +
    '<button class="btn ghost" onclick="collectDonate()" '+(dup?'disabled':'')+'>' +
      (dup ? '博物馆已有同款，不再重复收藏' : '捐赠博物馆（日票 +' + money(tk) + '，永久）') + '</button>' +
    (full ? '<p class="sub center" style="margin-top:6px">库房满了：可以当场出售，或先去库房处理一件</p>' : ''));
}
/* 拍卖开箱走完三选一后必须清场，否则拍卖行残留一个已结束的假场子，点啥都没反应 */
function auctionCleanup(){
  if(S.auction && S.auction.done){ S.auction = null; }
}
function collectSell(){
  if(!S._pending){ closeMask(); return; }
  const o = S._pending;
  const v = Math.round(sellPrice(o.base) * setBonusOf(o.name) * (o.src === 'courier' && eq('station') ? 1.15 : 1));
  S.money += v;
  if(o.src === 'courier') S.dayCourier = (S.dayCourier || 0) + v;
  if(o.src === 'auction') S.dayAuction = (S.dayAuction || 0) + v;
  say('出售【' + o.name + '】，到手 ' + money(v) + (setBonusOf(o.name) > 1 ? '（套装加成 ×' + setBonusOf(o.name).toFixed(2) + '）' : ''));
  auctionCleanup();
  S._pending = null; closeMask(); renderAll();
}
function collectStore(){
  const o = S._pending;
  S.store.push({ name:o.name, base:o.base, art:o.art, map:MAPS[S.map].name });
  say('【' + o.name + '】存入库房（' + S.store.length + '/' + S.storeCap + '）');
  auctionCleanup();
  S._pending = null; closeMask(); renderAll();
}
/* 套装集齐只播报一次 */
function setCheckAnnounce(name){
  const d = setDefOf(name); if(!d || !setDone(d)) return null;
  S._setAnnounced = S._setAnnounced || {};
  if(!S._setAnnounced[d.k]){ S._setAnnounced[d.k] = true; return d; }
  return null;
}
function collectDonate(){
  const o = S._pending;
  if(museumHasSame(o.name)){ closeMask(); return; }  /* 同款只收一件，双保险 */
  const tk = museumTicketOf(o.base);
  S.museum.push({ name:o.name, value:o.base, ticket:tk, art:o.art });
  say('【' + o.name + '】捐赠博物馆，日票 +' + money(tk));
  const sd = setCheckAnnounce(o.name);
  if(sd) say('✨ 套装【' + sd.n + '】集齐！对应藏品出售价 ×' + sd.b + ' 永久生效');
  commCheck();
  auctionCleanup();
  S._pending = null; closeMask(); renderAll();
}

function upgrade(){
  const cost = S.lv === 1 ? 320 : 1000;
  if(S.money < cost || S.lv >= 3) return;
  S.money -= cost; S.lv++;
  say('快递站升到 Lv.'+S.lv+'：免费盲盒 +1、稀有率 +0.5%（房租升到 ' + money(rent()) + '/天）');
  renderAll();
}

/* ================= 地图（V1.8 §6.2） ================= */
/* 主大厅 UI 主题跟随当前地图：强调色/按钮/导航/背景/名片胶囊整体换色；
   稀有度颜色（tag.b/.p/.y/.k、金光特效）为固定色，不受主题影响 */
function setTheme(){
  const m = MAPS[S.map], t = m.theme;
  const r = document.documentElement.style;
  r.setProperty('--acc', m.acc);
  if(t){
    Object.keys(t).forEach(k => r.setProperty('--' + k, t[k]));
  } else {
    r.setProperty('--gold', m.acc); r.setProperty('--gold2', m.acc);
  }
}
function canUnlock(k){
  const m = MAPS[k];
  return netWorth() >= m.need && S.money >= m.fee &&
         S.unboxCount >= m.needUnbox && (S.winsByMap[prevKey(k)]||0) >= m.needPrev;
}
function prevKey(k){
  const order = ['home','city','port'];
  return order[order.indexOf(k)-1] || 'home';
}
function unlockMap(k){
  const m = MAPS[k];
  if(S.brokeLock && k !== 'home') return;
  if(S.unlocked[k] || !canUnlock(k)) return;
  S.money -= m.fee;
  S.unlocked[k] = true;
  say('解锁新地图【' + m.name + '】！花费 ' + money(m.fee));
  flash('新地图解锁', '<div class="big" style="color:'+m.acc+'">'+m.name+'</div>' +
    '<p class="sub center">'+m.desc+'</p>' +
    '<button class="btn" onclick="switchMap(\''+k+'\');closeMask()">立即前往</button>');
  renderAll();
}
function switchMap(k){
  if(!S.unlocked[k] || S.auction) return;
  if(S.brokeLock && k !== 'home'){ say('保底期：高阶地图临时锁定'); return; }
  S.map = k; setTheme();
  rollOffers();
  say('前往【' + MAPS[k].name + '】' + (isAuctionDay() ? '，货源已按新地图刷新' : ''));
  renderAll();
}

/* ---- 地图卡片（可点击切换 / 解锁） ---- */
function mapIconSvg(k){
  const s = '<svg viewBox="0 0 48 48" style="width:26px;height:26px;display:block">';
  if(k === 'city') return s +
    '<rect x="9" y="18" width="12" height="24" fill="#5b8fb0" stroke="#1c2e3a" stroke-width="2"/>' +
    '<rect x="25" y="10" width="14" height="32" fill="#3e6d8e" stroke="#1c2e3a" stroke-width="2"/>' +
    '<rect x="28" y="14" width="3" height="3" fill="#bfe0f0"/><rect x="33" y="14" width="3" height="3" fill="#bfe0f0"/>' +
    '<rect x="28" y="21" width="3" height="3" fill="#bfe0f0"/><rect x="33" y="28" width="3" height="3" fill="#bfe0f0"/></svg>';
  if(k === 'port') return s +
    '<path d="M6 32 L42 32 L36 41 L12 41 Z" fill="#8a6543" stroke="#2e2519" stroke-width="2"/>' +
    '<rect x="12" y="24" width="10" height="8" fill="#c06a3a" stroke="#2e2519" stroke-width="1.5"/>' +
    '<rect x="24" y="24" width="10" height="8" fill="#d8a441" stroke="#2e2519" stroke-width="1.5"/>' +
    '<rect x="19" y="13" width="4" height="11" fill="#57514a"/>' +
    '<path d="M23 13 L34 17 L23 21 Z" fill="#c9c2b4"/></svg>';
  return s +
    '<path d="M8 22 L24 9 L40 22" fill="none" stroke="#e8d8b0" stroke-width="3" stroke-linecap="round"/>' +
    '<rect x="13" y="22" width="22" height="16" rx="2" fill="#a67c52" stroke="#2e2519" stroke-width="2"/>' +
    '<rect x="21" y="28" width="6" height="10" fill="#5a4a33"/></svg>';
}
function mapCondText(k){
  const m = MAPS[k], parts = [];
  if(m.need) parts.push('净资产 ' + money(m.need) + '（现 ' + money(netWorth()) + '）');
  if(m.needUnbox) parts.push('拆箱 ' + m.needUnbox + ' 次（现 ' + S.unboxCount + '）');
  if(m.needPrev) parts.push(m.prevName + ' 胜 ' + m.needPrev + ' 场（现 ' + (S.winsByMap[prevKey(k)]||0) + '）');
  return parts.join(' · ');
}
function mapProgress(k){
  const m = MAPS[k], ps = [];
  if(m.need) ps.push(Math.min(1, netWorth()/m.need));
  if(m.needUnbox) ps.push(Math.min(1, S.unboxCount/m.needUnbox));
  if(m.needPrev) ps.push(Math.min(1, (S.winsByMap[prevKey(k)]||0)/m.needPrev));
  return ps.length ? ps.reduce(function(a,b){return a+b;},0)/ps.length : 1;
}
function mapCardsHtml(){
  return '<div class="map-list">' + ['home','city','port'].map(function(k){
    const m = MAPS[k];
    const here = k === S.map, un = S.unlocked[k];
    const locked = S.brokeLock && k !== 'home' && !here;
    const can = !un && !locked && canUnlock(k);
    const badge = here ? '<span class="tag y">当前所在</span>'
      : un ? '<span class="tag g">已解锁</span>'
      : locked ? '<span class="tag r">保底期锁定</span>'
      : can ? '<span class="tag y">可解锁</span>' : '<span class="tag">未解锁</span>';
    let foot;
    if(un) foot = '<div class="map-meta">' + (here ? '就在这儿经营 · 点别的地图可换场' : '点击前往 · 货源按该地图刷新') + '</div>';
    else if(locked) foot = '<div class="map-meta">保底期锁定：现金回到 ¥1,000 后开放</div>';
    else foot = '<div class="map-meta">' + mapCondText(k) + '</div>' +
      '<div class="mpbar"><i style="width:' + Math.round(mapProgress(k)*100) + '%"></i></div>' +
      (can ? '<button class="map-go" onclick="event.stopPropagation();unlockMap(\'' + k + '\')">支付 ' + money(m.fee) + ' 解锁</button>' : '');
    return '<div class="map-card' + (here?' here':'') + (un||can?' open':' lock') + '" style="--mc:' + m.acc + '" onclick="tapMap(\'' + k + '\')">' +
      '<div class="map-ic">' + mapIconSvg(k) + '</div>' +
      '<div class="map-body"><div class="map-name">' + m.name + ' ' + badge + '</div>' +
        '<div class="map-desc">' + m.desc + '</div>' + foot + '</div></div>';
  }).join('') + '</div>';
}
function tapMap(k){
  if(k === S.map) return;
  if(S.unlocked[k]){
    if(S.auction){ say('拍卖进行中，先收槌或放弃再换地图'); return; }
    switchMap(k);
    if(!$('#mask').classList.contains('hide')) openMapPicker();
    return;
  }
  if(S.brokeLock && k !== 'home'){ say('保底期：高阶地图临时锁定'); return; }
  if(canUnlock(k)) unlockMap(k);
  else say('【' + MAPS[k].name + '】条件未达成：' + mapCondText(k));
}
function openMapPicker(){
  flash('选择地图 · 当前在 ' + MAPS[S.map].name, mapCardsHtml() +
    '<button class="btn ghost" onclick="closeMask()" style="margin-top:12px">关闭</button>');
}

/* ================= 拍卖（V1.8 §6.3） ================= */
function isAuctionDay(){ return (S.day - 1) % AUCTION_EVERY === 0; }
function daysToAuction(){ return (AUCTION_EVERY - ((S.day - 1) % AUCTION_EVERY)) % AUCTION_EVERY; }

function rollOffers(){
  S.offers = isAuctionDay() ? MAPS[S.map].tiers.map(t => ({
    tier:t, est:Math.round(rnd(t.est[0], t.est[1])), used:false
  })) : [];
}

function startAuction(offer){
  if(!isAuctionDay() || offer.used) return;
  const t = offer.tier;
  /* PRD §7.6 机遇：限时折扣 / 陷阱仓 5 折 / 免费仓库券；§7.5 羁绊减保证金 */
  const disc = (S.discount || 1) * (offer.trap ? 0.5 : 1);
  const base = Math.max(10, Math.round(t.base * disc));
  let fee = hasBond('friends') ? Math.round(t.fee/2) : t.fee;
  const useRepo = !!S.freeRepo;
  if(useRepo) fee = 0;
  if(S.money < base + fee){ say('资金不足：起拍 ' + money(base) + ' + 保证金 ' + money(fee)); return; }
  offer.used = true;
  if(useRepo) S.freeRepo = false;
  S.money -= fee;
  S.dayAuction = (S.dayAuction || 0) - fee;
  S.didWork = true;
  const m = MAPS[S.map];
  const agLv = (S.talentLv && S.talentLv.agent) || 1;
  const capMult = (hasTalent('agent') ? [0.9,0.87,0.84][agLv-1] : 1) *
                  (eq('bargain') ? 0.93 : 1) * (hasBond('pick') ? 0.95 : 1);
  S.auction = {
    map:S.map, tier:t, est:offer.est, price:base, leader:'none', fee, trap:!!offer.trap, hot:!!offer.hot,
    passed:[false,false,false], out:[false,false,false],
    usedSkills:{},
    ais: AI_TYPES.map(a => {
      /* 每个 AI 有自己的一杆秤：按各自估值误差出价，可能看走眼，不等于真实价值 */
      const aiEst = offer.est * rnd(0.75, 1.30);
      return {
        name:a.name, est:aiEst,
        cap:aiEst * rnd(a.cap[0],a.cap[1]) * capMult * (1 + m.aiBoost),
        step:a.step * offer.est, quit:a.quit, bluffed:false
      };
    }),
    done:false, busy:false, reveal:false, accurate:false
  };
  say((offer.trap ? '⚠ 压价接下传闻有诈的【' + t.name + '】，好胆量！' : '进入【' + t.name + '】竞拍') +
    '（保证金 ' + (fee ? money(fee) : '0 · 免费券') + '，战术点 ' + (S.ptsBank||0) + '/' + ptsCap() + '）');
  switchTab('auction'); renderAll();
}

function minInc(est){ return Math.max(10, Math.round(est*0.05)); }

function useSkill(k){
  const A = S.auction; if(!A || A.done || A.busy) return;
  const sk = SKILLS[k];
  if(A.usedSkills[k]){ say('本局已用过【' + sk.name + '】'); return; }
  if((S.ptsBank||0) < sk.cost){ say('战术点不够了（还剩 ' + (S.ptsBank||0) + ' 点），每天打烊 +1，攒够了再用'); sfx('click'); return; }
  S.ptsBank -= sk.cost; A.usedSkills[k] = true;
  if(k === 'scout'){ A.reveal = true; say('暗中打探：你摸清了每个对手的心理价——但那是它自己的判断，未必准。'); }
  else if(k === 'calm'){ A.accurate = true; say('冷静周旋：探测器误差收窄到 ±10%。'); }
  else if(k === 'rumor'){
    if(Math.random() < 0.75){ A.ais.forEach(a=>a.cap*=0.8); say('小道消息起效，AI 心理价位被压低 ×0.8。'); }
    else { A.ais.forEach(a=>a.cap*=1.15); say('谣言被识破！AI 反而抬价 ×1.15。'); sfx('lose'); }
  }
  else if(k === 'chaos'){
    A.ais.forEach(a=>a.cap*=rnd(0.7,1.3));
    say('舆论搅局：真假传闻满天飞，AI 心理价位大幅波动。'); sfx('bid');
  }
  renderAll();
}

function playerBid(amount){
  const A = S.auction; if(!A || A.done || A.busy) return;
  const target = amount || A.price + minInc(A.est);
  if(target > S.money){ say('资金不足，无法加到 ' + money(target)); return; }
  if(target <= A.price) return;
  A.price = target; A.leader = 'player';
  sfx('bid'); if(navigator.vibrate) navigator.vibrate(8);
  renderAll();
  setTimeout(aiRound, 420);
}

function playerPass(){
  const A = S.auction; if(!A || A.done || A.busy) return;
  if(A.leader === 'player'){ winAuction(); return; }
  if(A.leader === 'none'){ endAuction('none'); return; }
  endAuction('ai');
}

function aiRound(){
  const A = S.auction; if(!A || A.done) return;
  A.busy = true; A._busyAt = Date.now();
  renderAll();
  let i = 0;
  const step = () => {
    try {
      if(!S.auction || S.auction !== A || A.done) return;
      if(i >= A.ais.length){ afterAI(); return; }
      const ai = A.ais[i];
      if(A.out[i] || A.leader === i){ i++; step(); return; }
      const need = A.price + Math.max(minInc(A.est), Math.round(ai.step));
      const giveUp = Math.random() < ai.quit && A.price > A.est*1.1;
      const overCap = need > ai.cap;
      /* 虚张声势：偶发咬牙超出心理价一手，让「跟到底=大奖」不再成立 */
      const bluff = overCap && !ai.bluffed && Math.random() < 0.14;
      if(bluff){ ai.bluffed = true; }
      if(giveUp || (overCap && !bluff)){
        A.passed[i] = true; A.out[i] = true; i++; setTimeout(step, 240);
      } else {
        A.price = need; A.leader = i;
        say(ai.name + (bluff ? ' 咬牙再加一口 ' : ' 加到 ') + money(need));
        tone(300 + i*70, 0.07, 'square', 0.03);
        renderAll(); i++;
        setTimeout(step, 480);
      }
    } catch(e){
      /* AI 回合异常：解锁回合，交还玩家操作，不让拍卖卡死 */
      A.busy = false; A.done = false;
      say('拍卖回合异常，已恢复，请继续出价或收槌');
      renderAll();
    }
  };
  step();
}

/* 手机切后台/锁屏会冻结定时器，AI 回合可能永久挂起——每秒心跳自愈 */
setInterval(function(){
  const A = S.auction;
  if(A && A.busy && !A.done && Date.now() - (A._busyAt || 0) > 7000){
    A.busy = false; A._busyAt = 0;
    say('拍卖回合超时，已自动恢复');
    renderAll();
  }
}, 1000);

function afterAI(){
  const A = S.auction; if(!A || A.done) return;
  A.busy = false;
  if(A.leader === 'player'){ winAuction(); }
  else if(A.leader === 'none'){ endAuction('none'); }
  else { renderAll(); }
}

function winAuction(){
  const A = S.auction;
  if(!A || A.done) return;
  A.done = true;
  try {
    S.money -= A.price;
    S.dayAuction = (S.dayAuction || 0) - A.price;
    S.winsByMap[A.map] = (S.winsByMap[A.map]||0) + 1;
    if(A.price <= A.est * 0.7){ S.stats.bargainWins = (S.stats.bargainWins||0) + 1; }  /* 议价高手称号进度 */
    say('成交：' + money(A.price) + '（含保证金 ' + money(A.fee) + '）');
    sfx('win');
    renderAll();
  } catch(e){}
  setTimeout(function(){
    try { openLoot(); }
    catch(e){
      /* 开箱异常兜底：退回成交价，结束本场，不让拍卖卡死 */
      S.money += A.price;
      S.dayAuction = (S.dayAuction || 0) + A.price;
      S.auction = null; closeMask();
      say('开箱异常，本场已撤销退款 ' + money(A.price));
      renderAll();
    }
  }, 340);
}

/* V1.8 §6.3.3：基数 = 成交价；75% 0.2–2倍 / 20% 3–20倍 / 4% 50倍 / 1% 100倍
   PRD 叠加层：人才 → 羁绊 → 称号 → 连败逆袭，全部小幅微调，最后归一化（§8 全局封顶） */
function rollLootV18(price, forPlayer){
  const t = clone(LOOT_V18);
  const trap = forPlayer && S.auction && S.auction.trap;
  if(forPlayer && !trap){
    if(hasTalent('hunter')){
      const lv = (S.talentLv && S.talentLv.hunter) || 1, b = 0.01 + 0.01*lv;
      t[1].p += b; t[0].p -= b;
    }
    if(hasBond('steady') || eq('eye')){ t[0].p -= 0.03; t[1].p += 0.03; }   /* 残次 -3% */
    if(eq('goldhunter')){ t[2].p *= 1.3; t[3].p *= 1.3; }
    if(eq('gambler')){ t[2].p *= 1.5; t[3].p *= 1.5; t[0].p += 0.04; }
    if(S.auction && S.auction.hot){ t[1].p *= 1.1; t[2].p *= 1.3; t[3].p *= 1.5; }  /* 稀有货源突袭 */
    if((S.streak||0) >= 2){
      let b = 1.25 + 0.1*Math.min(S.streak,5);
      if(eq('streak3')) b *= 1.3;   /* 「触底反弹」称号：逆袭更猛（兑现称号文案） */
      t[2].p *= b; t[3].p *= b;
    }  /* 连败逆袭 */
    const sum = t.reduce((a,x)=>a+x.p,0);
    t.forEach(x=>x.p /= sum);
  }
  let row;
  if(trap){
    /* 陷阱仓：八成开残次坑，两成赌对了也有惊喜——便宜背后是坑，也可能真捡漏 */
    row = Math.random() < 0.8 ? t[0] : t[1];
  } else {
    let r = Math.random(), acc = 0; row = t[0];
    for(const x of t){ acc += x.p; if(r <= acc){ row = x; break; } }
  }
  const mult = rnd(row.mult[0], row.mult[1]);
  const value = Math.round(price * mult);
  const m = MAPS[forPlayer ? S.map : S.auction.map];
  let item, kind, tag;
  if(mult < 0.5){ item = pick(m.flavors.junk); kind = '残次'; tag = 'r'; }
  else if(mult < 2.5){ item = pick(m.flavors.goods); kind = '普通'; tag = ''; }
  else if(mult < 25){ item = pick(m.flavors.treasure); kind = '珍品'; tag = 'b'; }
  else if(mult < 60){ item = pick(m.flavors.treasure); kind = '爆发'; tag = 'p'; }
  else { item = pick(m.flavors.treasure); kind = '神话'; tag = 'y'; }
  return { kind, tag, item, mult, value };
}

function openLoot(){
  const A = S.auction;
  const res = rollLootV18(A.price, true);
  const profit = res.value - A.price - A.fee;
  const prevStreak = S.streak || 0;
  if(profit < 0) S.streak = prevStreak + 1;
  else {
    if(prevStreak >= 2){ S.stats.recover = (S.stats.recover||0) + 1; say('🔄 触底反弹：连亏 ' + prevStreak + ' 场后终于翻本！'); }
    S.streak = 0;
  }
  if(res.kind === '残次') S.stats.bad = (S.stats.bad||0) + 1;
  if(res.kind === '神话') S.stats.myth = (S.stats.myth||0) + 1;
  if(res.mult > (S.stats.bestMult||0)) S.stats.bestMult = res.mult;
  dexDiscover(res.item.n);
  if(res.kind === '神话' || res.kind === '爆发') S.megaCount = (S.megaCount || 0) + 1;

  if(res.kind === '神话' || res.kind === '爆发'){ sfx('rare'); celebrate(); }
  else if(profit >= 0) sfx('win');
  else sfx('lose');

  /* 超级大奖：弹幕循环播放恭喜（30 秒，下一条普通消息不抢占） */
  if(res.mult >= 25 || res.value >= 3000){
    tickerCelebrate('恭喜开出' + (res.kind === '残次' ? '稀世' : res.kind) + '级【' + res.item.n + '】！价值 ' + money(res.value) + '，血赚 ' + money(Math.max(0, profit)) + '！');
  }

  say('开箱：' + res.item.n + '（' + res.kind + ' ×' + res.mult.toFixed(1) + '），基准价值 ' + money(res.value));

  const intro = '<p class="sub" style="font-style:italic;color:#8c8578;text-align:center;margin:0 0 4px">' + pick(AUCTION_SCENES) + '</p>' +
    '<div class="center"><span class="tag '+res.tag+'">'+res.kind+' ×'+res.mult.toFixed(1)+'</span></div>' +
    '<div class="price">'+money(res.value)+'<small>成交价 '+money(A.price)+' · 盈亏 '+(profit>=0?'+':'-')+money(Math.abs(profit))+'（含保证金）</small></div>' +
    '<p class="sub" style="text-align:center;font-style:italic;color:#a89b84;margin:2px 4px 0">「' +
      (DEX_STORY[res.item.n] || '箱底的东西没什么来历，但分量不轻。') + '」</p>';

  if(res.mult >= 3){
    /* 收藏级：三向处理 */
    collectModal({ name:res.item.n, base:res.value, art:itemArt(res.item), from:'仓库开箱', src:'auction' });
    /* 把开箱信息插到弹窗顶部 */
    const box = $('#mask-box');
    box.innerHTML = intro + box.innerHTML;
  } else {
    /* 普通杂物残次品：仅直接出售（按当日行情，修复大师可加成） */
    const v = Math.round(sellPrice(res.value) * fixerMult());
    flash('开箱', itemArt(res.item) + intro +
      '<div class="center sub">杂物残次品只能直接出售：到手 ' + money(v) + '（行情 ×' + S.market.toFixed(2) + (fixerMult()>1 ? ' · 修复大师 ×' + fixerMult().toFixed(1) : '') + '）</div>' +
      '<button class="btn" onclick="quickSell()">变现 ' + money(v) + '</button>');
    S._quick = v;
  }
  commCheck();
  achCheck();
  renderAll();
}
function quickSell(){
  if(S._quick == null){ closeMask(); return; }
  S.money += S._quick; say('变现 ' + money(S._quick));
  S.dayAuction = (S.dayAuction || 0) + S._quick;
  S._quick = null; S.auction = null;
  closeMask(); renderAll();
}

/* AI 拍下后揭晓它的下场（基数同为成交价） */
function endAuction(who){
  const A = S.auction; if(!A) return;
  A.done = true;
  if(who === 'none'){
    S.auction = null;
    say('无人出价，流拍。保证金不退。');
    flash('流拍', '<p class="sub center">这批仓没人接手，拍卖师收槌。<br>你的保证金 ' + money(A.fee) + ' 不退。</p>' +
      '<button class="btn" onclick="closeMask();switchTab(\'auction\')">返回拍卖行</button>');
    renderAll(); return;
  }
  const ai = A.ais[A.leader];
  const res = rollLootV18(A.price, false);
  const profit = res.value - A.price - A.fee;
  S.auction = null;
  say(ai.name + ' 以 ' + money(A.price) + ' 拍下，开出「' + res.item.n + '」（' + res.kind + '）值 ' + money(res.value));
  sfx(profit >= 0 ? 'lose' : 'win');
  flash(ai.name + ' 拍下了',
    itemArt(res.item) +
    '<div class="center"><span class="tag '+res.tag+'">'+res.kind+' · '+res.item.n+'</span></div>' +
    '<div class="price">'+money(res.value)+'<small>成交价 '+money(A.price)+' · '+
      (profit>=0 ? '赚了 ' : '亏了 ') + money(Math.abs(profit))+'</small></div>' +
    '<p class="sub center">'+(profit >= 0 ? '他赌对了，这一仓没白抢。' : '他看走眼了，这一仓砸手里了。')+'</p>' +
    '<button class="btn" onclick="closeMask();switchTab(\'auction\')">收起</button>');
  renderAll();
}

    S.team.splice(i,1); say(TALENTS[k].name + ' 卸下，羁绊重新结算');
  } else {
    if(S.team.length >= 2){ say('同时最多上阵 2 名人才（PRD §7.5）'); return; }
    S.team.push(k);
    const bondHit = activeBonds().some(b => b.need.indexOf(k) >= 0);  /* 上阵后真正成活的羁绊才播报 */
    say(TALENTS[k].name + ' 上阵！' + (bondHit ? '触发羁绊！' : ''));
  }
  sfx('click'); renderAll();
}
function upgradeTalent(k){
  if(!TALENTS[k] || (S.team||[]).indexOf(k) < 0) return;
  const lv = (S.talentLv && S.talentLv[k]) || 1;
  if(lv >= 3) return;
  const cost = TALENT_LV_COST * lv;
  if(S.money < cost) return;
  S.money -= cost;
  S.talentLv = S.talentLv || {}; S.talentLv[k] = lv + 1;
  say(TALENTS[k].name + ' 升到 Lv.' + (lv+1) + '，花费 ' + money(cost));
  sfx('receive'); renderAll();
}

/* ================= 库房（V1.8 §6.4） ================= */
function expandStore(){
  const cost = 2000 * Math.pow(2, S.storeCap - 6);
  if(S.money < cost) return;
  S.money -= cost; S.storeCap++;
  say('库房扩容到 ' + S.storeCap + ' 格，花费 ' + money(cost));

}
function sellStore(i){
  const it = S.store[i]; if(!it) return;
  const v = Math.round(sellPrice(it.base) * setBonusOf(it.name));
  S.money += v; S.store.splice(i,1);
  say('出售库房藏品【' + it.name + '】，到手 ' + money(v) + (setBonusOf(it.name) > 1 ? '（套装加成 ×' + setBonusOf(it.name).toFixed(2) + '）' : ''));

}
function donateStore(i){
  const it = S.store[i]; if(!it) return;
  if(museumHasSame(it.name)){ say('博物馆已有同款【' + it.name + '】，不再重复收藏'); return; }

function sellToVisitor(){

  if(!v || !S.store[v.i] || S.store[v.i].name !== v.name){ S._visitor = null; closeMask(); return; }
  const it = S.store[v.i];

  S.money += offer;
  S.dayOther = (S.dayOther || 0) + offer;
  S.store.splice(v.i, 1);
  say('📱 买家上门收走【' + it.name + '】，到手 ' + money(offer));
  S._visitor = null;
  closeMask(); renderAll();
}

/* ================= 股票基金（V1.8 §6.9） ================= */
function investUnlocked(){ return netWorth() >= INVEST_UNLOCK_NET && !S.brokeLock; }
function buyConfirm(kind, amt){
  const k = INVEST_KINDS[kind];
  const warn = amt > netWorth()*0.3;
  flash('投资确认 · ' + k.name,
    '<div class="price">'+money(amt)+'<small>'+k.desc+'</small></div>' +
    '<p class="sub center">到期自动结算本金与盈亏；中途赎回收手续费 12%（下限 5%）。</p>' +
    (warn ? '<p class="center"><span class="risk">⚠ 投入超过总资产 30%，风险提示</span></p>' : '') +
    '<button class="btn" onclick="buyInvest(\''+kind+'\','+amt+')">确认投入</button>' +
    '<button class="btn ghost" onclick="closeMask()">再想想</button>');
}
function buyInvest(kind, amt){
  if(S.money < amt){ say('资金不足'); return; }
  const k = INVEST_KINDS[kind];
  S.money -= amt;
  S.invest.push({
    kind, name:k.name, principal:amt, buyDay:S.day,
    total:int(k.days[0], k.days[1]),
    ret:rnd(k.ret[0], k.ret[1])
  });
  say('买入' + k.name + ' ' + money(amt) + '（' + S.invest[S.invest.length-1].total + ' 天后到期）');
  closeMask(); renderAll();
}
function redeemInvest(i){
  const it = S.invest[i]; if(!it) return;
  const k = Math.min(1, (S.day - it.buyDay) / it.total);
  const cur = Math.round(it.principal * (1 + it.ret * k));
  const fee = Math.max(REDEEM_FEE_MIN, Math.round(cur * REDEEM_FEE));
  const get = cur - fee;
  flash('中途赎回 · ' + it.name,
    '<div class="price">'+money(get)+'<small>当前净值 '+money(cur)+' − 手续费 '+money(fee)+'（12%）</small></div>' +
    '<p class="sub center">提前赎回会损失手续费'+(it.ret<0?'，且承担已产生的亏损':'')+'。</p>' +
    '<button class="btn" onclick="redeemGo('+i+')">确认赎回</button>' +
    '<button class="btn ghost" onclick="closeMask()">持有到期</button>');
}
function redeemGo(i){
  const it = S.invest[i]; if(!it) return;
  const k = Math.min(1, (S.day - it.buyDay) / it.total);
  const cur = Math.round(it.principal * (1 + it.ret * k));
  const fee = Math.max(REDEEM_FEE_MIN, Math.round(cur * REDEEM_FEE));
  S.money += cur - fee;
  S.invest.splice(i,1);
  say('赎回' + it.name + '，到手 ' + money(cur - fee) + '（手续费 ' + money(fee) + '）');
  closeMask(); renderAll();
}
function settleInvests(){
  let html = '';
  for(let i = S.invest.length-1; i >= 0; i--){
    const it = S.invest[i];
    if(S.day >= it.buyDay + it.total){
      const v = Math.round(it.principal * (1 + it.ret));
      S.money += v;
      S.invest.splice(i,1);
      const pf = v - it.principal;
      say('【' + it.name + '】到期结算：' + (pf>=0?'+':'') + money(pf));
      html += '<div class="item"><span>'+it.name+' '+money(it.principal)+'</span><span style="color:'+(pf>=0?'#7fbf95':'#d98a76')+'">'+
        (pf>=0?'+':'-')+money(Math.abs(pf))+'</span></div>';
    }
  }
  return html ? '<div class="card"><h3>投资到期结算</h3>' + html + '</div>' : '';
}

/* ================= 限时委托（PRD §7.6：收藏家订单，进度计入成就与人才解锁） ================= */
const COMM_POOL = [
  { k:'unbox',  n:'开箱热身', cur:()=>S.unboxCount,    need:[3,5], reward:[400,900] },
  { k:'donate', n:'馆藏扩充', cur:()=>S.museum.length, need:[2,3], reward:[600,1200] },
  { k:'auc',    n:'拍场练手', cur:()=>auctionWins(),   need:[1,2], reward:[800,1500] }
];
function maybeCommission(){
  if(S.commission || S.brokeLock) return;
  if(Math.random() > 0.45) return;
  const d = pick(COMM_POOL);
  const need = int(d.need[0], d.need[1]);
  S.commission = { k:d.k, n:d.n, need, base:d.cur(),
    reward:int(d.reward[0], d.reward[1]) + need*80, ddl:S.day + int(4,6) };
  say('📩 限时委托【' + d.n + '】：' + commTxt() + '，奖励 ' + money(S.commission.reward) + ' + 1 战术点（第 ' + S.commission.ddl + ' 天前完成）');
}
function commTxt(){
  const c = S.commission;
  return { unbox:'累计拆 ' + c.need + ' 个快递盲盒',
           donate:'捐赠 ' + c.need + ' 件藏品进博物馆',
           auc:'赢下 ' + c.need + ' 场拍卖' }[c.k];
}
function commCur(){ const d = COMM_POOL.find(x=>x.k===S.commission.k); return d ? d.cur() : 0; }
function commCheck(showFlash){
  if(!S.commission) return;
  const c = S.commission;
  if(S.day > c.ddl){ say('⌛ 限时委托【' + c.n + '】超时作废，收藏家很失望'); S.commission = null; return; }
  if(commCur() - c.base >= c.need){
    S.money += c.reward;
    S.ptsBank = Math.min(ptsCap(), (S.ptsBank||0) + 1);
    S.stats.commDone = (S.stats.commDone||0) + 1;
    S.commission = null;
    say('✅ 限时委托【' + c.n + '】完成！奖励 ' + money(c.reward) + ' + 1 战术点');
    sfx('rare');
    if(showFlash){
      flash('委托完成', '<div class="price">' + money(c.reward) + '<small>收藏家很满意，额外 +1 战术点</small></div>' +
        '<button class="btn" onclick="closeMask()">干得漂亮</button>');
    }
  }
}

/* ================= 随机机遇 & 动态事件（PRD §7.6，每天打烊后刷新） ================= */
function rollDailyEvent(){
  S.discount = null;   /* 折扣只限当日 */
  if(S.brokeLock) return;
  const pool = [];
  if(!S.freeRepo) pool.push({ w:2, f(){ S.freeRepo = true; say('🎁 机遇：拍卖行老友塞给你一张【免费仓库券】，下一场拍卖免保证金'); } });
  pool.push({ w:2, f(){ S.discount = 0.7; say('🏷 机遇：拍卖行限时折扣！今日货源起拍价 7 折'); } });
  pool.push({ w:2, f(){ S.free = (S.free||0) + 3; say('📦 超级盲盒雨：商家塞来一车福袋，今日免费快递 +3'); } });
  if(S.store.length) pool.push({ w:2, f:rollBlack });
  if(S.store.length >= 3) pool.push({ w:1, f(){
    const i = int(0, S.store.length - 1), it = S.store[i];
    S.store.splice(i,1);
    say('🚨 风险：查扣风暴！库房【' + it.name + '】被认定来路不明，直接没收'); sfx('lose');
  }});
  if(isAuctionDay() && S.offers.some(o=>!o.used)) pool.push({ w:2, f(){
    const o = pick(S.offers.filter(x=>!x.used));
    o.trap = true;
    say('⚠ 风险：内线消息，今日【' + o.tier.name + '】传闻有人做局——起拍 5 折，十有八九有诈。便宜背后可能是坑，也可能真捡漏');
  }});
  if(isAuctionDay() && S.offers.some(o=>!o.used)) pool.push({ w:2, f(){
    const o = pick(S.offers.filter(x=>!x.used));
    o.hot = true;
    o.est = Math.round(o.est * rnd(1.4, 1.6));   /* 稀有货源：估值看涨，AI 也会盯 */
    say('🔥 机遇：稀有货源突袭！【' + o.tier.name + '】混进一批好货，估值看涨——对手也红着眼呢');
  }});
  if(!pool.length) return;
  const tw = pool.reduce((a,x)=>a+x.w,0);
  let r = Math.random()*tw;
  for(const x of pool){ r -= x.w; if(r <= 0){ x.f(); return; } }
}
/* 黑市委托：高价收库房货，25% 概率被查罚款（PRD §7.6 风险机遇） */
function rollBlack(){
  const i = int(0, S.store.length - 1), it = S.store[i];
  const mult = (hasTalent('blacker') ? 2.6 : 2.2) * (hasBond('shade') ? 1.1 : 1);
  const offer = Math.max(100, Math.round(sellPrice(it.base) * mult));
  S._black = { i, offer, name:it.name, base:it.base, art:it.art };
  say('🌙 黑市委托：有人出 ' + money(offer) + ' 收【' + it.name + '】（约行情 ' + mult.toFixed(1) + ' 倍，但有被查风险）');
}
function showBlack(){
  const b = S._black; if(!b) return;
  flash('🌙 黑市委托',
    (b.art || '') +
    '<div class="center"><span class="tag r">高风险 · 高收益</span></div>' +
    '<div class="center" style="margin:6px 0">' + b.name + ' · 基准 ' + money(b.base) + ' · 行情 ' + money(sellPrice(b.base)) + '</div>' +
    '<div class="price">' + money(b.offer) + '<small>黑市出价</small></div>' +
    '<p class="sub center">私下交易来钱快，但 25% 概率被便衣盯上，罚款六成。' +
      (hasTalent('blacker') ? '黑市商人熟门熟路，出价更高。' : '') + '</p>' +
    '<button class="btn danger" onclick="acceptBlackGo()">铤而走险 +' + money(b.offer) + '</button>' +
    '<button class="btn ghost" onclick="S._black=null;closeMask()">不蹚浑水</button>');
}
function acceptBlackGo(){
  const b = S._black; if(!b){ closeMask(); return; }
  if(!S.store[b.i] || S.store[b.i].name !== b.name){ S._black = null; closeMask(); return; }
  const it = S.store[b.i];
  S.money += b.offer;
  S.dayOther = (S.dayOther || 0) + b.offer;
  S.store.splice(b.i, 1);
  S.stats.black = (S.stats.black||0) + 1;
  say('🌙 黑市出手【' + it.name + '】，到手 ' + money(b.offer));
  S._black = null; closeMask();
  if(Math.random() < 0.25){
    const fine = Math.min(S.money >= 0 ? Math.round(b.offer*0.6) : 0, Math.max(0, S.money));
    if(fine > 0){
      S.money -= fine;
      say('🚔 便衣盯上了这单黑市生意，罚款 -' + money(fine));
      setTimeout(function(){
        flash('被盯上了', '<p class="sub center" style="line-height:1.8">黑市交易走漏风声，罚款 ' + money(fine) + '。<br>黑市来钱快，风险也真大。</p>' +
          '<button class="btn" onclick="closeMask()">认栽</button>');
      }, 200);
    }
  }
  achCheck(); renderAll();
}

function settleDay(){
  const rentV = rent(), payV = ticketPay();
  const invHtml = settleInvests();
  S.money += payV - rentV;
  if(S.money < 100){ S.money += 80; say('老主顾照顾生意，补贴 +' + money(80) + '（余额偏低时的保底扶持）'); }
  S.day++; S.free = 2 + S.lv + (eq('courier_f') ? 1 : 0); S.didWork = false;
  S.ptsBank = Math.min(ptsCap(), (S.ptsBank||0) + (hasTalent('agent') ? 2 : 1));  /* 战术点：跨场存量，打烊攒 */
  rollMarket();
  rollOffers();
  /* 彩蛋事件（V1.8 §6.6 简化） */
  if(Math.random() < 0.18){
    if(Math.random() < 0.5){
      const g = int(50, 300) + S.lv*50;
      S.money += g; say('彩蛋：柜台缝里捡到 ' + money(g));
    } else {
      S.marketForce = 1.4 + rnd(0, 0.4);
      say('传闻：明天' + pick(CATS) + '有大行情，囤好货。');
    }
  }
  /* PRD §7.6：随机机遇 / 风险事件 / 限时委托 */
  rollDailyEvent();
  commCheck(true);
  maybeCommission();
  /* 买家上门收购：随机看上库房某件货，出价 1.15–1.6 倍行情价（对标旧物集短信出价） */
  let visitor = null;
  if(!S.brokeLock && S.store.length && !S._black && Math.random() < 0.45){
    const i = int(0, S.store.length - 1);
    const it = S.store[i];
    const offer = Math.max(50, Math.round(sellPrice(it.base) * rnd(1.15, 1.6) *
      (hasTalent('blacker') ? 1.1 : 1) * (hasBond('shade') ? 1.1 : 1)));
    visitor = { i, offer, name: it.name, art: it.art, base: it.base };
  }
  /* 破产保底（V1.8 七）：归零不清档，快递站保底重新起家 */
  if(S.money < 0){
    S.money = 0; S.brokeLock = true;
    flash('保底保护', '<p class="sub center" style="line-height:1.8">现金交完房租归零了。' +
      '高阶地图与投资中心临时锁定，快递站每日免费盲盒依旧生效——重新起家吧。</p>' +
      '<button class="btn" onclick="closeMask()">继续经营</button>');
    say('现金归零，进入保底期（高阶地图与投资临时锁定）');
  } else if(S.brokeLock && S.money >= 1000){
    S.brokeLock = false;
    say('走出保底期，高阶地图与投资中心重新开放。');
  }
  const courierV = S.dayCourier || 0;
  const aucV = S.dayAuction || 0;
  const othV = S.dayOther || 0;
  say('第 ' + S.day + ' 天结算：快递变现 +' + money(courierV) +
      (aucV !== 0 ? '，拍卖收支 ' + (aucV>=0?'+':'-') + money(Math.abs(aucV)) : '') +
      (othV !== 0 ? '，上门收购 +' + money(othV) : '') +
      '，房租 -' + money(rentV) + '，门票 +' + money(payV) +
      '，余额 ' + money(S.money) + (isAuctionDay() ? '。今天拍卖会开市！' : '。'));
  S.dayCourier = 0; S.dayAuction = 0; S.dayOther = 0;
  achCheck();
  commCheck(true);
  if(!S.brokeLock){
    closeMask();
    if(invHtml){
      setTimeout(function(){ flash('投资结算', invHtml + '<button class="btn" onclick="closeMask()">知道了</button>'); }, 100);
    } else if(visitor){
      S._visitor = visitor;
      setTimeout(function(){
        flash('买家上门',
          (visitor.art || '') +
          '<div class="center"><span class="tag y">'+visitor.name+'</span></div>' +
          '<div class="center sub" style="margin:6px 0 10px">「成色还行，'+money(visitor.offer)+'，现在就拿。」<br>基准 '+money(visitor.base)+' · 行情价 '+money(sellPrice(visitor.base))+'，他出得更高。</div>' +
          '<button class="btn" onclick="sellToVisitor()">成交 +'+money(visitor.offer)+'</button>' +
          '<button class="btn ghost" onclick="closeMask()">婉拒，继续囤</button>');
      }, 100);
    } else if(S._black){
      setTimeout(showBlack, 100);
    }
  }
  renderAll();
}

  $('#h-name').textContent = S.name || '无名仓主';
  $('#h-log').innerHTML = S.log.join('<br>');
  const inv = investUnlocked();
  $('#tab-invest').classList.toggle('hide', !inv);
  achCheck();
  renderCourier(); renderAuction(); renderMuseum(); renderStore(); renderMe();
  if(inv) renderInvest();
  saveGame();
}

function renderCourier(){
  const rare = ((0.01 + 0.005*(S.lv-1))*100).toFixed(1);
  const upCost = S.lv === 1 ? 320 : 1000;
  const aid = daysToAuction();
  const bull = S.market >= 1.3, bear = S.market <= 0.9;
  $('#scene-courier').innerHTML =
    banner('courier', MAPS[S.map].name, sceneSub('courier')) +
    '<div class="card"><h3>市场看板 <span class="tag '+(bull?'y':(bear?'r':''))+'">'+marketWord()+' ×'+S.market.toFixed(2)+'</span></h3>' +
      '<p>今日热门品类：<b>'+S.marketCat+'</b>。波动只影响<b>直接出售</b>价；库房藏品每日同步新卖价，可以囤货等牛市抛售；博物馆门票不受波动。</p>' +
    '</div>' +
    '<div class="card"><h3>快递站 <span class="tag">Lv.'+S.lv+'</span></h3>' +
      '<p>今日免费盲盒：<b>'+S.free+'</b> 个 · 稀有率 '+rare+'%</p>' +
      '<p>房租 <b>'+money(rent())+'</b>/天 · 下次拍卖会 <b>'+(aid===0?'今天':aid+' 天后')+'</b></p>' +
      '<button class="btn" onclick="unboxCourier()" '+(S.free>0?'':'disabled')+'>'+
        (S.free>0 ? '拆一个快递盲盒（免费）' : '今日免费已拆完')+'</button>' +
      (S.lv<3 ? '<button class="btn ghost" onclick="upgrade()" '+(S.money<upCost?'disabled':'')+'>升级快递站 '+money(upCost)+'</button>' : '') +
      (S.lv>=2 ? '<button class="btn ghost" onclick="batchCourier()" '+(S.money<BATCH_COST?'disabled':'')+'>快递大礼包 '+money(BATCH_COST)+'（6件 · 保底惊喜 · 刷图鉴）</button>' : '') +
      '<button class="btn ghost" onclick="nextDay()" '+(S.didWork?'':'disabled')+'>'+
        (S.didWork?'打烊 · 进入下一天':'今天还没开张，不能打烊')+'</button>' +
    '</div>' +
    '<div class="card"><h3>产出梯度</h3>' +
      '<div style="display:flex;justify-content:space-around;align-items:flex-start;padding:2px 0 8px">' +
        [2,0,1,3].map(i =>
          '<div style="text-align:center">'+giftArt(COURIER_POOL[i].tier)+
          '<div class="sub" style="font-size:11px;margin-top:2px'+(i===3?';color:var(--gold2);font-weight:600':'')+'">'+COURIER_POOL[i].tier+'</div></div>'
        ).join('') +
      '</div>' +
      [2,0,1,3].map(i => { const r = COURIER_POOL[i]; return '<div class="item"><span>'+r.tier+'</span><span class="sub">'+
        money(Math.min(...r.items.map(x=>x.v[0])))+'–'+money(Math.max(...r.items.map(x=>x.v[1])))+'</span></div>'; }).join('') +
      '<p class="sub" style="margin-top:8px">快递线日期望约 '+money((2+S.lv)*22)+'、房租 '+money(rent())+'：只够保本，亏也亏得慢；余额过低时有老主顾补贴 +¥80 托底，不会卡死。</p>' +
    '</div>';
}

function renderAuction(){
  const A = S.auction;
  if(A && (!A.ais || !A.tier || typeof A.leader === 'undefined')){
    S.auction = null;  /* 残缺拍卖状态直接清场，不让渲染崩掉 */
  }
  const A2 = S.auction;
  if(A2 && A2.done){
    /* 已结束的场子不渲染任何可交互按钮，双保险防假场子 */
    $('#scene-auction').innerHTML =
      '<div class="card"><h3>'+A2.tier.name+' <span class="tag g">已落槌</span></h3>' +
      '<p class="sub center">本场已结束，正在处理拍品…</p></div>';
    return;
  }
  if(A2){
    const A = A2;
    const lead = A.leader === 'player' ? '你' : (A.leader === 'none' ? '暂无' : A.ais[A.leader].name);
    const lock = A.busy ? 'disabled' : '';
    const sk = Object.keys(SKILLS).map(k =>
      '<button class="skbtn" onclick="useSkill(\''+k+'\')" '+((A.busy||A.done||(S.ptsBank||0)<SKILLS[k].cost||A.usedSkills[k])?'disabled':'')+'>'+
        SKILLS[k].name+' <b>'+SKILLS[k].cost+'点</b></button>').join('');
    $('#scene-auction').innerHTML =
      '<div class="card"><h3>'+A.tier.name+' <span class="tag">估值 '+money(A.est)+'</span></h3>' +
        '<div class="sub center">保证金 '+money(A.fee)+' 已付（不退）· 战术点 <b style="color:var(--gold2)">'+(S.ptsBank||0)+'</b>/'+ptsCap()+
          '<span style="opacity:.7">（跨场共通 · 打烊 +1'+(hasTalent('agent')?'，经纪人 +2':'')+'）</span></div>' +
        (A.trap ? '<p class="sub center" style="color:#d98a76">⚠ 这仓是传闻做局的陷阱仓：八成开残次，两成赌对有惊喜</p>' : '') +
        '<div class="price">'+money(A.price)+'<small>当前最高价 · 领先：'+lead+'</small></div>' +
        clues(A) +
        '<div class="row">' +
          '<button class="btn" onclick="playerBid()" '+lock+'>'+(A.busy?'对手正在出价…':'加价到 '+money(A.price+minInc(A.est)))+'</button>' +
          '<button class="btn danger" onclick="playerPass()" '+lock+'>'+((A.leader==='player'||A.leader==='none')?'收槌':'放弃')+'</button>' +
        '</div>' +
        '<div class="row" style="flex-wrap:wrap">'+sk+'</div>' +
        '<p class="sub" style="margin-top:4px">技能只在轮次间隙释放；干扰技能会被 AI 抵抗，没有稳赢战术。</p>' +
      '</div>' +
      '<div class="card"><h3>对手状态</h3>' +
        A.ais.map((a,i)=>'<div class="item"><span>'+a.name+(A.reveal?'<span class="sub"> 它的心理价≈'+money(a.cap)+'</span>':'')+'</span>'+
          '<span class="tag '+ (A.passed[i]?'r':'g') +'">'+(A.passed[i]?'已放弃':'在场')+'</span></div>').join('') +
        (A.reveal ? '<p class="sub" style="margin-top:8px">心理价是它自己估的，可能看走眼，也可能咬牙虚张——跟得凶不等于一定出大奖。</p>' : '') +
      '</div>';
    return;
  }

  const m = MAPS[S.map];
  const mapBtns = mapCardsHtml();

  if(!isAuctionDay()){
    $('#scene-auction').innerHTML =
      banner('auction','仓库拍卖行', sceneSub('auction')) +
      '<div class="card"><h3>今日休市 <span class="tag">还有 '+daysToAuction()+' 天</span></h3>' +
        '<p>拍卖会每 '+AUCTION_EVERY+' 天开一场；当前地图【'+m.name+'】'+m.desc+'。</p>' +
        '<button class="btn ghost" onclick="switchTab(\'courier\')">去快递站拆箱子</button>' +
      '</div>' +
      '<div class="card"><h3>地图 · 点击切换或解锁</h3>' + mapBtns + '</div>';
    return;
  }

  const left = S.offers.filter(o => !o.used).length;
  $('#scene-auction').innerHTML =
    banner('auction', m.name + ' · 拍卖会', m.desc) +
    ((S.streak||0) >= 2 ? '<div class="card"><h3>🔥 触底反弹 <span class="tag y">连亏 '+S.streak+' 场</span></h3>' +
      '<p class="sub">连败逆袭生效：今日开箱爆发/神话概率提升 +'+Math.round((0.25+0.1*Math.min(S.streak,5))*100)+'%（相对）。胆子大就上，输了明天更猛。</p></div>' : '') +
    '<div class="card"><h3>今日货源 <span class="tag">还剩 '+left+' 批</span>' +
      (S.discount ? ' <span class="tag y">限时折扣 7 折</span>' : '') +
      (S.freeRepo ? ' <span class="tag y">免费券待用</span>' : '') + '</h3>' +
      S.offers.map((o,i) => {
        const baseV = Math.max(10, Math.round(o.tier.base * ((S.discount||1) * (o.trap?0.5:1))));
        const feeV = S.freeRepo ? 0 : (hasBond('friends') ? Math.round(o.tier.fee/2) : o.tier.fee);
        const need = baseV + feeV;
        const poor = S.money < need;
        const risky = need > netWorth()*0.5;
        const lock = o.used || poor;
        const lbl = o.used ? '本批已结束' : (poor ? '资金不足' : '入场 '+money(feeV)+' · 起拍 '+money(baseV));
        return '<div class="card" style="background:#171411;margin:8px 0;opacity:'+(o.used?0.45:1)+'">' +
          '<h3>'+o.tier.name+' <span class="tag">估值 '+money(o.est)+'</span>'+(o.hot?'<span class="tag y">🔥 稀有货源</span>':'')+(o.trap?'<span class="risk">⚠ 传闻有诈 · 5 折</span>':'')+(risky?'<span class="risk">⚠ 占净资产 50%+</span>':'')+'</h3>' +
          '<p class="sub">保证金 '+money(feeV)+'（不退）· 起拍 '+money(baseV)+(o.tier.base!==baseV?' <s style="opacity:.6">'+money(o.tier.base)+'</s>':'')+'</p>' +
          '<button class="btn" onclick="startAuction(S.offers['+i+'])" '+(lock?'disabled':'')+'>'+lbl+'</button></div>';
      }).join('') +
    '</div>' +
    '<div class="card"><h3>出货概率 <span class="tag">公示</span></h3>' +
      '<p class="sub">按成交价折算：75% 开出 0.2–2 倍（小亏小赚）｜20% 开出 3–20 倍｜4% 约 50 倍爆发｜1% 极限神话 100 倍。行话叫「空仓」「假货」，赌仓有风险，落槌需谨慎。</p>' +
    '</div>' +
    '<div class="card"><h3>地图 · 点击切换或解锁</h3>' + mapBtns + '</div>';
}

function clues(A){
  const seed = A.tier.name;
  const apLv = (S.talentLv && S.talentLv.appraiser) || 1;
  const baseErr = hasTalent('appraiser') ? [0.40,0.32,0.25][apLv-1] : (eq('god') ? 0.28 : 0.40);
  const err = A.accurate ? Math.min(0.10, baseErr) : baseErr;
  const arr = [
    '声音：纸箱摩擦声，夹杂硬物碰撞',
    '轮廓：' + (A.est > (A.tier.est[0]+A.tier.est[1])/2 ? '箱体堆放密集，分量十足' : '摆放零散，空隙较大'),
    '探测器：读数 ' + money(A.est*rnd(1-err,1+err)) + '（误差 ±' + (err*100) + '%）'
  ];
  if(hasTalent('appraiser')) arr.push('老师傅：' + (A.est > (A.tier.est[0]+A.tier.est[1])/2 ? '这仓里有真东西，别放' : '这批成色一般，压价'));
  return arr.map(t=>'<div class="clue">'+t+'</div>').join('');
}

function renderMuseum(){
  const t = ticketPay();
  const dexC = dexCount();
  const achC = ACH_DEFS.filter(d => S.ach && S.ach[d.k]).length;
  $('#scene-museum').innerHTML =
    banner('museum','私人博物馆', sceneSub('museum')) +
    '<div class="card"><h3>博物馆 <span class="tag y">'+S.museum.length+' 件</span></h3>' +
      '<p>每日门票收益 <b>'+money(t)+'</b>（约估值的 6.7%/天，永久，不受行情波动）</p>' +
      (S.museum.length ? S.museum.map(m =>
        '<div class="item"><span><span class="mini">'+m.art+'</span>'+m.name+'</span><span class="sub">估值 '+money(m.value)+' · 日票 '+money(museumTicketOf(m.value))+'</span></div>').join('')
        : iconMuseum() + '<p class="sub center">展柜还空着。开出收藏级珍品后，可以选择捐赠。</p>') +
    '</div>' +
    '<div class="card"><h3>🏺 套装陈列 <span class="tag '+(setDoneCount()?'y':'')+'">'+setDoneCount()+' / '+SET_DEFS.length+' 套生效</span></h3>' +
      SET_DEFS.map(d => {
        const c = Math.min(setCountOf(d), setNeed(d)), nd = setNeed(d), done = setDone(d);
        return '<div class="item"><span>'+d.n+'</span><span class="sub" style="color:'+(done?'#7fbf95':'#a89b84')+'">'+
          c+'/'+nd+' 件'+(done ? ' · 出售价 ×'+d.b+(eq('setmaster')?' +5%':'') : '')+'</span></div>';
      }).join('') +
      '<p class="sub" style="margin-top:6px">同类珍品在博物馆集齐即自动点亮套装（PRD §7.4）：对应藏品出售价永久加成，集齐 2 套解锁「博物大藏家」称号。</p>' +
    '</div>' +
    '<div class="card"><h3>📖 旧物集 <span class="tag '+(dexC>=DEX_LIST.length?'y':'')+'">'+dexC+' / '+DEX_LIST.length+' 种</span></h3>' +
      '<div class="pbar"><i style="width:'+Math.round(dexC/DEX_LIST.length*100)+'%"></i></div>' +
      '<div class="dex-grid">' +
        DEX_LIST.map(function(x){
          if(!(S.dex && S.dex[x.n]))
            return '<div class="dex-cell locked"><div class="qm">?</div><div class="dn">待发现</div></div>';
          return '<div class="dex-cell got '+(DEX_CLASS[x.cat]||'t1')+'" title="点击查看档案" onclick="openDexItem(\''+x.n+'\')">' +
            itemArt(x,1) +
            '<div class="dn">'+x.n+'</div><div class="dc">'+x.cat+'</div></div>';
        }).join('') +
      '</div>' +
      '<p class="sub" style="margin-top:8px">拆快递、拍卖开箱自动收录 · 灰=残次 / 青=普通 / 紫=珍品 / 金=稀有</p>' +
    '</div>' +
    '<div class="card"><h3>🏆 成就墙 <span class="tag '+(achC>=ACH_DEFS.length?'y':'')+'">'+achC+' / '+ACH_DEFS.length+'</span></h3>' +
      '<div class="pbar"><i style="width:'+Math.round(achC/ACH_DEFS.length*100)+'%"></i></div>' +
      '<div class="ach-grid">' +
        ACH_DEFS.map(function(d){
          const got = S.ach && S.ach[d.k];
          return '<div class="ach-cell'+(got?' on':'')+'"><span class="aic">'+(got?'🏆':'🔒')+'</span>' +
            '<div class="an">'+d.n+'</div><div class="ad">'+d.d+'</div></div>';
        }).join('') +
      '</div>' +
    '</div>';
}

function renderStore(){
  const cost = 2000 * Math.pow(2, S.storeCap - 6);
  $('#scene-store').innerHTML =
    '<div class="card"><h3>私人库房 <span class="tag">'+S.store.length+'/'+S.storeCap+' 格</span></h3>' +
      '<p>库房藏品即刻点亮图鉴与收集成就；无门票收益；卖出价每日随行情刷新，可以囤货等牛市。</p>' +
      '<button class="btn ghost" onclick="expandStore()" '+(S.money<cost?'disabled':'')+'>扩容 +2 格 '+money(cost)+'</button>' +
      (S.store.length ? S.store.map((it,i) =>
        '<div class="item"><span><span class="mini">'+it.art+'</span>'+it.name+
          '<br><span class="sub">'+(it.map||'')+'</span></span>' +
          '<span class="sub">基准 '+money(it.base)+' · 今日卖 '+money(sellPrice(it.base))+'</span></div>' +
        '<div class="row"><button class="btn" onclick="sellStore('+i+')">出售 '+money(sellPrice(it.base))+'</button>' +
        '<button class="btn ghost" onclick="donateStore('+i+')">捐赠博物馆</button></div>'
      ).join('') : '<p class="sub center">库房是空的。开箱拿到收藏级珍品（×3 以上）可以存进来。</p>') +
    '</div>';
}

function renderInvest(){
  $('#scene-invest').innerHTML =
    '<div class="card"><h3>投资中心</h3>' +
      '<p class="sub">只用流动资金投资；藏品与博物馆资产不可动用。情报系统、金融事件属后续版本。</p>' +
    '</div>' +
    Object.keys(INVEST_KINDS).map(k => {
      const kd = INVEST_KINDS[k];
      return '<div class="card"><h3>'+kd.name+'</h3>' +
        '<p class="sub">'+kd.desc+'</p>' +
        '<div class="row">' +
          '<button class="skbtn" onclick="buyConfirm(\''+k+'\','+Math.max(100,Math.round(S.money*0.1))+')">投入 10%</button>' +
          '<button class="skbtn" onclick="buyConfirm(\''+k+'\','+Math.max(100,Math.round(S.money*0.3))+')">投入 30%</button>' +
          '<button class="skbtn" onclick="buyConfirm(\''+k+'\','+Math.max(100,Math.round(S.money))+')">全部投入</button>' +
        '</div></div>';
    }).join('') +
    '<div class="card"><h3>持仓</h3>' +
      (S.invest.length ? S.invest.map((it,i) => {
        const k = Math.min(1, (S.day - it.buyDay) / it.total);
        const cur = Math.round(it.principal * (1 + it.ret * k));
        const left = it.buyDay + it.total - S.day;
        return '<div class="item"><span>'+it.name+' '+money(it.principal)+
          '<br><span class="sub">'+(left>0?left+' 天后到期':'今日到期')+' · 当前净值 '+money(cur)+'</span></span></div>' +
          '<div class="row"><button class="btn ghost" onclick="redeemInvest('+i+')">中途赎回（12% 手续费）</button></div>';
      }).join('') : '<p class="sub center">暂无持仓。</p>') +
    '</div>';
}

/* ================= 弹层与切页 ================= */
function flash(title, html){
  $('#mask-box').innerHTML = '<div class="center" style="color:var(--gold2);font-size:13px;letter-spacing:2px;margin-bottom:6px">'+title+'</div>' + html;
  $('#mask').classList.remove('hide');
  $('#mask-box').classList.remove('pop'); void $('#mask-box').offsetWidth; $('#mask-box').classList.add('pop');
}
function closeMask(){ $('#mask').classList.add('hide'); }

function switchTab(name){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  TABS.forEach(n => $('#scene-'+n).classList.toggle('hide', n !== name));
}

function toggleSound(){
  S.sound = !S.sound;
  $('#snd').textContent = S.sound ? '声音 开' : '声音 关';
  if(S.sound) sfx('click');
}
function resetGame(){
  flash('重新开始', '<p class="sub center">清空当前存档，从第 1 天重来？</p>' +
    '<button class="btn danger" onclick="resetGo()">确认重开</button>' +
    '<button class="btn ghost" onclick="closeMask()">取消</button>');
}
function resetGo(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  closeMask(); newGame();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#snd').onclick = toggleSound;
$('#reset').onclick = resetGame;
resumeGame();

</script>
